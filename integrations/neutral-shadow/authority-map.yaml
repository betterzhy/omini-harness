schemaVersion: project-authority-map/v1
authorities:
  - id: api-boundary-decision
    path: decisions.md
    format: MARKDOWN_KV
    role: CANONICAL
    required: true
    owns:
      - topic.api-boundary.status
      - topic.api-boundary.baseline
    selectors:
      topic.api-boundary.status:
        key: ApiBoundaryStatus
        required: true
      topic.api-boundary.baseline:
        key: ApiBoundaryBaseline
        required: true
  - id: controlled-planning-manifest
    path: controlled-planning.yaml
    format: YAML
    role: CANONICAL
    required: true
    owns:
      - controlled_planning.mode
      - controlled_planning.contract_registry_digest
      - controlled_planning.dependency_graph_digest
      - controlled_planning.authorization_envelope_digest
      - controlled_planning.slice_descriptor_digests
      - controlled_planning.conflict_policy_version
      - controlled_coordination.admission.bindings
    selectors:
      controlled_planning.mode:
        key: planning.mode
        required: true
      controlled_planning.contract_registry_digest:
        key: planning.contractRegistryDigest
        required: true
      controlled_planning.dependency_graph_digest:
        key: planning.dependencyGraphDigest
        required: true
      controlled_planning.authorization_envelope_digest:
        key: planning.authorizationEnvelopeDigest
        required: true
      controlled_planning.slice_descriptor_digests:
        key: planning.sliceDescriptorDigests
        required: true
      controlled_planning.conflict_policy_version:
        key: planning.conflictPolicyVersion
        required: true
      controlled_coordination.admission.bindings:
        key: admission.bindings
        required: true
  - id: coordinator-issuer
    path: coordinator-issuer.yaml
    format: YAML
    role: CANONICAL
    required: true
    owns: []
    selectors: {}
  - id: deep-reviewer
    path: deep-reviewer-public.pem
    format: MARKDOWN_KV
    role: SPECIALIZED
    required: true
    owns: []
    selectors: {}
  - id: global-status
    path: status.md
    format: MARKDOWN_KV
    role: CANONICAL
    required: true
    owns:
      - project.stage
      - permission.development
    selectors:
      project.stage:
        key: ProjectStage
        required: true
      permission.development:
        key: DevelopmentAuthorization
        required: true
        normalization:
          rules:
            - operator: PREFIX
              expected: 'YES'
              value: ALLOW
            - operator: PREFIX
              expected: 'NO'
              value: DENY
          default: UNKNOWN
  - id: lifecycle-controller
    path: lifecycle-authority-public.pem
    format: MARKDOWN_KV
    role: SPECIALIZED
    required: true
    owns: []
    selectors: {}
  - id: recovery-controller
    path: recovery-authority-public.pem
    format: MARKDOWN_KV
    role: SPECIALIZED
    required: true
    owns: []
    selectors: {}
  - id: release-control
    path: release-control.yaml
    format: YAML
    role: SPECIALIZED
    required: true
    owns:
      - permission.stage4
      - permission.stage5
    selectors:
      permission.stage4:
        key: release.stage4
        required: true
      permission.stage5:
        key: release.stage5
        required: true
  - id: status-summary
    path: reports/status-summary.json
    format: JSON
    role: DERIVED
    required: false
    owns: []
    selectors: {}
requiredFacts:
  - controlled_planning.mode
  - controlled_planning.contract_registry_digest
  - controlled_planning.dependency_graph_digest
  - controlled_planning.authorization_envelope_digest
  - controlled_planning.slice_descriptor_digests
  - controlled_planning.conflict_policy_version
  - controlled_coordination.admission.bindings
  - project.stage
  - permission.development
  - permission.stage4
  - permission.stage5
  - topic.api-boundary.status
  - topic.api-boundary.baseline
