[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evolution-harness"
version = "0.1.0"
description = "Executable MVP for governed agent design and engineering evolution"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.20"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
  "fast: deterministic focused coverage with no live External Pack candidate Gate",
  "integration: cross-module, Git, projection, or integration coverage",
  "pack_e2e: serial integration coverage executing a real External Pack candidate Gate/toolchain",
]
